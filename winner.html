<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light only" />
<title>The Winner Is...</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --paper: #FBF3E7;
  --card: #FFFFFF;
  --ink: #2B3350;
  --ink-soft: #5B6482;
  --coral: #FF6B57;
  --coral-dark: #DE4E3B;
  --gold: #F0A93B;
  --sage: #6FA98A;
  --sage-dark: #4F8068;
  --display: 'Caveat', cursive;
  --body: 'Work Sans', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

html { color-scheme: light; }
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--body);
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 0%, rgba(255,107,87,0.06) 0%, transparent 45%),
    radial-gradient(circle at 85% 100%, rgba(111,169,138,0.08) 0%, transparent 45%),
    var(--paper);
  background-attachment: fixed;
  min-height: 100vh;
  line-height: 1.5;
}

.wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; position: relative; }

.back-home {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--sage-dark);
  text-decoration: none;
  margin-bottom: 24px;
}
.back-home:hover { color: var(--coral-dark); }

.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--coral-dark);
  margin: 0 0 6px;
}

h1 { font-family: var(--display); font-weight: 700; color: var(--ink); margin: 0 0 8px; line-height: 1.15; font-size: 42px; }
p { color: var(--ink-soft); margin: 0 0 16px; }
.subtitle { font-size: 17px; }

.card {
  background: var(--card);
  color: var(--ink);
  border-radius: 12px;
  padding: 28px;
  margin-top: 12px;
  box-shadow: 0 10px 0 rgba(43,51,80,0.06), 0 10px 28px rgba(43,51,80,0.1);
}

.chip {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--gold);
  color: var(--ink);
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 14px;
}

.center { text-align: center; }

.reveal {
  opacity: 0;
  transform: translateY(40px) scale(0.95);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.is-visible { opacity: 1; transform: translateY(0) scale(1); }

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1 !important; transform: none !important; }
}

#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="wrap">
  <a href="index.html" class="back-home">← Back home</a>
  <section id="content" class="center">
    <p class="eyebrow reveal">Results</p>
    <h1 id="heading" class="reveal">Loading...</h1>
    <div id="body-content" class="reveal"></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCjG8kH7hRaDJVatF7Ai-e5756CFjltrNw",
  authDomain: "trial-and-error-ec3db.firebaseapp.com",
  projectId: "trial-and-error-ec3db",
  storageBucket: "trial-and-error-ec3db.firebasestorage.app",
  messagingSenderId: "982404896399",
  appId: "1:982404896399:web:58400ac56e58d8bd6802fa",
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const SUBMISSIONS_COLLECTION = "submissions";

const DataLayer = {
  async getWinner() {
    const q = query(collection(db, SUBMISSIONS_COLLECTION), where("isWinner", "==", true));
    const snap = await getDocs(q);
    return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
  },
};

const APP_CONFIG = {
  teacherName: "Mithu Ma'am",
  openDate: "2026-09-05T00:00:00",
  closeDate: "2026-09-05T23:59:59",
};

/* ---- Confetti ---- */
function fireConfetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const canvas = document.getElementById("confetti-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ["#F0A93B", "#FF6B57", "#6FA98A", "#FBF3E7"];
  const pieces = Array.from({ length: 90 }, () => ({
    x: canvas.width / 2 + (Math.random() - 0.5) * 120,
    y: canvas.height * 0.35,
    vx: (Math.random() - 0.5) * 10,
    vy: Math.random() * -8 - 4,
    size: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rotation: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 10,
    gravity: 0.28,
  }));
  let frame = 0;
  function tick() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    pieces.forEach((p) => {
      p.vy += p.gravity; p.x += p.vx; p.y += p.vy; p.rotation += p.rotSpeed;
      if (p.y < canvas.height + 20) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if (alive && frame < 240) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}

/* ---- Reveal ---- */
document.querySelectorAll('.reveal').forEach((el) => el.classList.add('is-visible'));

/* ---- Page logic ---- */
(async function () {
  const openDate = new Date(APP_CONFIG.openDate);
  const closeDate = new Date(APP_CONFIG.closeDate);
  const now = new Date();
  const heading = document.getElementById("heading");
  const body = document.getElementById("body-content");
  const dateLabel = openDate.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });

  if (now < openDate) {
    heading.textContent = "Results Aren't In Yet";
    body.innerHTML = `<p class="subtitle">The trivia opens on ${dateLabel} — check back after it closes that night.</p>`;
    return;
  }

  if (now <= closeDate) {
    heading.textContent = "Trivia Is Still Open!";
    body.innerHTML = `<p class="subtitle">Results will be revealed once today's window closes at 11:59 PM. Haven't submitted yet? There's still time.</p>`;
    return;
  }

  heading.textContent = "Loading results...";
  let winner;
  try {
    winner = await DataLayer.getWinner();
  } catch (err) {
    heading.textContent = "Couldn't Load Results";
    body.innerHTML = `<p class="subtitle">Check your connection and refresh the page.</p>`;
    return;
  }

  if (!winner) {
    heading.textContent = "Winner Coming Soon";
    body.innerHTML = `<p class="subtitle">${APP_CONFIG.teacherName} and the organizers are still picking a winner — check back soon!</p>`;
    return;
  }

  heading.textContent = `🏆 ${winner.name}!`;
  body.innerHTML = `
    <div class="card">
      <p class="chip">Winner</p>
      <p>Congratulations! You scored <strong>${winner.score}/${winner.totalQuestions}</strong> on the trivia, and your wish stood out to ${APP_CONFIG.teacherName}.</p>
      <img src="${winner.photoURL}" style="max-width:100%;border-radius:8px;margin-top:12px;" />
    </div>
  `;
  fireConfetti();
})();
</script>
</body>
</html>
